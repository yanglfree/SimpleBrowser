name: ZhuoBrowser
options:
  bundleIdPrefix: com.youdroid
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  ZhuoBrowser:
    type: application
    platform: iOS
    sources:
      - path: ZhuoBrowser
        excludes:
          - Resources/**
      - path: ZhuoBrowser/Resources/js
        buildPhase: resources
        type: folder
      - path: ZhuoBrowser/Resources/rules
        buildPhase: resources
        type: folder
      - path: Shared
    dependencies:
      - target: ZhuoBrowserShareExtension
        embed: true
    entitlements:
      path: ZhuoBrowser/ZhuoBrowser.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youdroid.zhuobrowser
        PRODUCT_NAME: ZhuoBrowser
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: ZhuoBrowser/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 卓阅
  ZhuoBrowserShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ZhuoBrowserShareExtension
      - path: Shared
    entitlements:
      path: ZhuoBrowserShareExtension/ZhuoBrowserShareExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youdroid.zhuobrowser.share
        PRODUCT_NAME: ZhuoBrowserShareExtension
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: ZhuoBrowserShareExtension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: true
  ZhuoBrowserTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZhuoBrowserTests
    dependencies:
      - target: ZhuoBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youdroid.zhuobrowser.tests
        GENERATE_INFOPLIST_FILE: true
