name: ZhuoBrowser
options:
  bundleIdPrefix: com.youdroid
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  ZhuoBrowser:
    type: application
    platform: iOS
    sources:
      - path: ZhuoBrowser
        excludes:
          - Resources/**
    resources:
      - path: ZhuoBrowser/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youdroid.zhuobrowser
        PRODUCT_NAME: ZhuoBrowser
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: ZhuoBrowser/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 卓阅
  ZhuoBrowserTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZhuoBrowserTests
    dependencies:
      - target: ZhuoBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youdroid.zhuobrowser.tests
        GENERATE_INFOPLIST_FILE: true
